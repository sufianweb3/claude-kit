name: kit check
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: rescan everything with the pinned scanner
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Registry, generated files, audit records and private terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}   # one term per line; kit.py never prints them
        run: python scripts/kit.py check
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # scan the full history, not just the tip
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Secret scan (history and working tree, fails on any hit)
        run: |
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --exit-code 1
          "$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --exit-code 1
  rescan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Full rescan (fails if any item now has un-reviewed HIGH/CRITICAL findings)
        run: python scripts/kit.py audit --all && git diff --stat audits/
