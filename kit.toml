[[rejected]]
id = "openhands"
date = "2026-07-31"
reason = "Standalone agent harness, not a loadable capability."

[[rejected]]
id = "ruflo"
date = "2026-07-31"
reason = "Standalone harness that duplicates orchestration."

[[rejected]]
id = "strix"
date = "2026-07-31"
reason = "Standalone harness, not a loadable capability."

[[rejected]]
